[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
build_dir = build-cam

upload_port = COM7
upload_speed = 460800

monitor_speed = 921600
monitor_rts = 0    ; ⚠️ RTS=False 才能释放 EN
monitor_dtr = 0    ; ⚠️ DTR=False 才能释放 IO0

lib_deps =
    esp32-camera

build_flags =
    ; JPEG 分片大小（与固件中 CHUNK_SIZE 保持一致）
    -DCHUNK_SIZE=4096
