<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DietAI 健康饮食管理App - 人工测试方案</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-light: #d1fae5;
      --primary-dark: #065f46;
      --secondary: #f59e0b;
      --success: #16a34a;
      --success-light: #dcfce7;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --warning: #f59e0b;
      --warning-light: #fef3c7;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --gray-900: #111827;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--gray-900);
      background: var(--gray-50);
      line-height: 1.7;
    }
    .top-bar {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff;
      padding: 32px 48px;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
    }
    .top-bar h1 { font-size: 26px; font-weight: 700; }
    .top-bar .meta { font-size: 13px; opacity: .85; margin-top: 6px; }
    .top-bar .meta span { margin-right: 20px; }
    .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }

    /* Stats */
    .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: #fff; border: 1px solid var(--gray-200); border-radius: 12px; padding: 20px; text-align: center; }
    .stat-card .stat-num { font-size: 32px; font-weight: 800; color: var(--primary); }
    .stat-card .stat-num.green { color: var(--success); }
    .stat-card .stat-num.red { color: var(--danger); }
    .stat-card .stat-num.gray { color: var(--gray-500); }
    .stat-card .stat-label { font-size: 13px; color: var(--gray-500); margin-top: 4px; }

    /* Tester form */
    .tester-form {
      background: #fff; border: 1px solid var(--gray-200); border-radius: 12px;
      padding: 24px 32px; margin-bottom: 32px;
    }
    .tester-form h2 { font-size: 18px; color: var(--primary-dark); margin-bottom: 16px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 13px; font-weight: 600; color: var(--gray-700); }
    .form-group input, .form-group select {
      padding: 8px 12px; border: 1px solid var(--gray-300); border-radius: 8px;
      font-size: 14px; outline: none; transition: border .2s;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); }

    /* Flow card */
    .flow-card {
      border: 2px solid var(--primary); border-radius: 16px;
      margin: 28px 0; overflow: hidden; background: #fff;
      box-shadow: 0 4px 16px rgba(16,185,129,.08);
    }
    .flow-header {
      background: linear-gradient(90deg, #059669, #10b981);
      color: #fff; padding: 20px 28px;
      font-size: 18px; font-weight: 700;
      display: flex; align-items: center; gap: 14px;
    }
    .flow-header .flow-icon { font-size: 28px; }
    .flow-header .flow-badge {
      margin-left: auto; background: rgba(255,255,255,.2);
      padding: 4px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    }
    .flow-body { padding: 24px 28px; }
    .flow-desc {
      background: var(--primary-light); border-left: 4px solid var(--primary);
      padding: 14px 18px; margin-bottom: 20px; border-radius: 0 10px 10px 0;
      font-size: 14px; color: var(--gray-700);
    }
    .flow-desc strong { color: var(--primary-dark); }

    /* Flow status bar */
    .flow-status-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; background: var(--gray-50); border-radius: 8px;
      margin-bottom: 16px; font-size: 13px; color: var(--gray-700);
    }
    .flow-status-bar .status-tag {
      padding: 2px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
    }
    .status-tag.pending { background: var(--gray-200); color: var(--gray-500); }
    .status-tag.pass { background: var(--success-light); color: #166534; }
    .status-tag.fail { background: var(--danger-light); color: #991b1b; }
    .status-tag.partial { background: var(--warning-light); color: #92400e; }

    /* TC card */
    .tc-card {
      border: 1px solid var(--gray-200); border-radius: 10px;
      margin: 14px 0; overflow: hidden; transition: box-shadow .2s;
    }
    .tc-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .tc-card.tc-pass { border-left: 4px solid var(--success); }
    .tc-card.tc-fail { border-left: 4px solid var(--danger); }
    .tc-header {
      background: linear-gradient(90deg, var(--primary-light), #f0fdf4);
      padding: 14px 20px; font-size: 15px; font-weight: 700;
      color: var(--primary-dark); border-bottom: 1px solid var(--gray-200);
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      user-select: none;
    }
    .tc-header .tc-tag {
      font-size: 11px; background: var(--primary); color: #fff;
      padding: 2px 10px; border-radius: 999px; flex-shrink: 0;
    }
    .tc-header .tc-status {
      margin-left: auto; font-size: 12px; padding: 2px 12px;
      border-radius: 999px; font-weight: 600;
    }
    .tc-header .tc-status.pending { background: var(--gray-200); color: var(--gray-500); }
    .tc-header .tc-status.pass { background: var(--success-light); color: #166534; }
    .tc-header .tc-status.fail { background: var(--danger-light); color: #991b1b; }
    .tc-header .toggle-arrow { transition: transform .2s; font-size: 14px; color: var(--gray-500); }
    .tc-header .toggle-arrow.open { transform: rotate(90deg); }
    .tc-body { padding: 16px 20px; display: none; }
    .tc-body.open { display: block; }

    /* Step */
    .step {
      margin: 10px 0; padding: 14px 16px;
      background: var(--gray-50); border-left: 3px solid var(--primary);
      border-radius: 0 8px 8px 0;
    }
    .step-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .step-title { font-weight: 700; font-size: 13px; color: var(--primary-dark); }
    .step-radio { display: flex; gap: 8px; }
    .step-radio label {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px; cursor: pointer; padding: 4px 12px;
      border: 1px solid var(--gray-300); border-radius: 6px;
      transition: all .2s;
    }
    .step-radio label:has(input:checked).pass-label { background: var(--success-light); border-color: var(--success); color: #166534; }
    .step-radio label:has(input:checked).fail-label { background: var(--danger-light); border-color: var(--danger); color: #991b1b; }
    .step-radio input { display: none; }
    .step-op { font-size: 13px; color: var(--gray-700); margin-bottom: 4px; }
    .step-expect { font-size: 13px; color: var(--success); }
    .step-expect::before { content: "预期："; font-weight: 600; }
    .step-reason {
      margin-top: 8px; display: none;
    }
    .step-reason.show { display: block; }
    .step-reason textarea {
      width: 100%; padding: 8px 12px; border: 1px solid var(--gray-300);
      border-radius: 8px; font-size: 13px; resize: vertical; min-height: 60px;
      font-family: inherit;
    }
    .step-reason textarea:focus { border-color: var(--primary); outline: none; }

    /* Overall */
    .case-overall {
      background: #fff7e6; border: 2px solid #ffd591; border-radius: 8px;
      padding: 16px 20px; margin-top: 16px;
    }
    .case-overall h5 { font-size: 14px; color: #d46b08; margin-bottom: 10px; }
    .overall-radio { display: flex; gap: 10px; margin-bottom: 8px; }
    .overall-radio label {
      display: flex; align-items: center; gap: 4px;
      font-size: 13px; cursor: pointer; padding: 6px 16px;
      border: 1px solid var(--gray-300); border-radius: 8px; transition: all .2s;
    }
    .overall-radio label:has(input:checked).pass-label { background: var(--success-light); border-color: var(--success); color: #166534; }
    .overall-radio label:has(input:checked).fail-label { background: var(--danger-light); border-color: var(--danger); color: #991b1b; }
    .overall-radio input { display: none; }
    .overall-reason { margin-top: 10px; display: none; }
    .overall-reason.show { display: block; }
    .overall-reason textarea {
      width: 100%; padding: 8px 12px; border: 1px solid var(--gray-300);
      border-radius: 8px; font-size: 13px; resize: vertical; min-height: 80px;
      font-family: inherit;
    }

    /* Submit */
    .submit-section {
      text-align: center; margin: 40px 0;
      background: #fff; border: 1px solid var(--gray-200); border-radius: 12px;
      padding: 32px;
    }
    .submit-btn {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff; border: none; padding: 14px 48px; font-size: 16px;
      font-weight: 700; border-radius: 12px; cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(16,185,129,.3); }
    .submit-hint { margin-top: 12px; color: var(--gray-500); font-size: 14px; }

    /* Progress */
    .progress-section {
      background: #fff; border: 1px solid var(--gray-200); border-radius: 12px;
      padding: 24px 32px; margin-bottom: 32px;
    }
    .progress-section h2 { font-size: 18px; color: var(--primary-dark); margin-bottom: 16px; }
    .progress-bar { background: var(--gray-200); border-radius: 999px; height: 24px; overflow: hidden; position: relative; }
    .progress-fill { background: linear-gradient(90deg, #059669, #10b981); height: 100%; border-radius: 999px; transition: width .3s; min-width: 0; }
    .progress-label { position: absolute; right: 12px; top: 3px; font-size: 12px; font-weight: 700; color: var(--gray-700); }

    /* Toast */
    .toast {
      position: fixed; top: 80px; right: 24px; z-index: 999;
      padding: 14px 24px; border-radius: 10px; font-size: 14px; font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,.15); transform: translateX(120%);
      transition: transform .3s;
    }
    .toast.show { transform: translateX(0); }
    .toast.success { background: var(--success-light); color: #166534; border: 1px solid var(--success); }
    .toast.error { background: var(--danger-light); color: #991b1b; border: 1px solid var(--danger); }
    .toast.warning { background: var(--warning-light); color: #92400e; border: 1px solid var(--warning); }

    @media (max-width: 768px) {
      .top-bar { padding: 20px; }
      .container { padding: 16px 8px; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .form-grid { grid-template-columns: 1fr; }
      .flow-body { padding: 16px; }
      .step-top { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
    @media print {
      .top-bar { position: static; }
      .flow-card, .tc-card { break-inside: avoid; }
      .tc-body { display: block !important; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <h1>DietAI 健康饮食管理App - 人工测试方案</h1>
  <div class="meta">
    <span>版本 v1.0</span>
    <span>11个功能模块 · 28个测试用例</span>
    <span id="topStatus">测试状态：待执行</span>
  </div>
</div>

<div class="container">

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card"><div class="stat-num" id="statTotal">28</div><div class="stat-label">总用例数</div></div>
<div class="stat-card"><div class="stat-num green" id="statPass">0</div><div class="stat-label">通过</div></div>
<div class="stat-card"><div class="stat-num red" id="statFail">0</div><div class="stat-label">不通过</div></div>
<div class="stat-card"><div class="stat-num gray" id="statPending">28</div><div class="stat-label">待测试</div></div>
  </div>

  <!-- Tester form -->
  <div class="tester-form">
    <h2>测试人员信息</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>测试人员姓名 *</label>
        <input type="text" id="testerName" placeholder="请输入姓名">
      </div>
      <div class="form-group">
        <label>测试日期 *</label>
        <input type="date" id="testerDate">
      </div>
      <div class="form-group">
        <label>测试环境</label>
        <select id="testerEnv">
          <option value="development">本地开发环境</option>
          <option value="testing">测试环境</option>
          <option value="production">生产环境</option>
        </select>
      </div>
      <div class="form-group">
        <label>测试设备</label>
        <select id="testerDevice">
          <option value="android">Android真机</option>
          <option value="ios">iOS真机</option>
          <option value="emulator">安卓模拟器</option>
          <option value="chrome">Chrome浏览器</option>
          <option value="windows">Windows桌面</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-section">
    <h2>测试进度</h2>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
      <span class="progress-label" id="progressLabel">0%</span>
    </div>
  </div>

  <!-- Flows container -->
  <div id="flowsContainer"></div>

  <!-- Submit -->
  <div class="submit-section">
    <button class="submit-btn" onclick="submitResults()">提交测试结果</button>
    <p class="submit-hint">提交后，测试结果将导出为JSON文件并保存到浏览器本地</p>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── 测试数据 ──
const testFlows = [
  {
    id: 'flow1', name: '模块一：用户认证', icon: '🔐',
    description: '验证用户注册、登录功能的完整性和输入校验。包括用户名/密码长度校验、手机号格式校验等。',
    testCases: [
      { id: 'TC-001', title: '新用户注册 - 完整流程', steps: [
        { title: '步骤1：打开注册页面', op: '打开App进入登录页，点击"注册"按钮', expect: '跳转到注册页面，显示用户名、手机号、邮箱、密码、确认密码输入框' },
        { title: '步骤2：填写注册信息', op: '输入用户名"demo_user"、手机号"13800138000"、密码"Demo123456"、确认密码"Demo123456"，邮箱留空', expect: '各字段显示正确，邮箱为空时无错误提示' },
        { title: '步骤3：提交注册', op: '点击"注册"按钮', expect: '注册成功，弹出"注册成功！让我们设置您的个人资料"提示，自动跳转到引导页' }
      ]},
      { id: 'TC-002', title: '已有用户登录', steps: [
        { title: '步骤1：输入正确凭据登录', op: '使用用户名"123"、密码"12345678"登录', expect: '登录成功，跳转到首页，显示用户历史数据' },
        { title: '步骤2：错误密码登录', op: '使用用户名"123"、错误密码"wrongpassword"登录', expect: '提示"用户名或密码错误"，登录不成功' }
      ]}
    ]
  },
  {
    id: 'flow2', name: '模块二：饮食记录', icon: '🍽️',
    description: '验证拍照识别食物、手动录入饮食、查看每日营养汇总三大核心功能的完整性和AI识别准确性。',
    testCases: [
      { id: 'TC-003', title: '拍照识别食物', steps: [
        { title: '步骤1：选择记录餐次和时间', op: '点击首页“午餐”的"记录"按钮，选择时间', expect: '正常显示选择记录方式的弹窗' },
        { title: '步骤2：选择拍照识别', op: '选择"AI扫描器"', expect: '相机正常启动，显示取景框' },
        { title: '步骤3：拍摄食物图片', op: '拍摄一张食物照片（提前准备清晰的食物图片）', expect: '照片拍摄成功，进入分析页面' },
        { title: '步骤4：查看结果', op: '等待AI分析', expect: 'AI识别出食物名称，显示热量、蛋白质、脂肪等营养成分' },
        { title: '步骤5：保存结果', op: '点击"确认"保存', expect: '饮食记录保存成功，首页营养数据更新' }
      ]},
      { id: 'TC-004', title: '手动录入饮食', steps: [
        { title: '步骤1：打开手动录入', op: '点击"添加饮食" → "手动录入"', expect: '显示食物描述输入框和餐次选择' },
        { title: '步骤2：输入食物描述并确认', op: '输入"一碗米饭+宫保鸡丁"，选择餐次"午餐"，点击"确认"', expect: 'AI解析食物并计算营养，显示识别结果和总热量' },
        { title: '步骤3：验证营养数据', op: '返回首页查看今日营养汇总', expect: '总热量、蛋白质、碳水、脂肪数据显示正确' }
      ]},
      { id: 'TC-005', title: '查看每日营养汇总', steps: [
        { title: '步骤1：查看首页营养卡片', op: '返回首页，查看顶部"今日热量"区域', expect: '显示今日摄入热量/目标热量、进度环、三大营养素比例' },
        { title: '步骤2：验证热量来源分析', op: '查看"热量来源分析"环形图', expect: '环形图显示蛋白质/碳水/脂肪比例，中心显示总热量kcal数值' },
        { title: '步骤3：验证营养素进度条', op: '查看蛋白质/碳水/脂肪的进度条', expect: '各营养素当前值与目标值对比显示正确' }
      ]}
    ]
  },
  {
    id: 'flow3', name: '模块三：喝水记录', icon: '💧',
    description: '验证快速添加喝水、自定义饮水量、达标动画等功能的交互完整性和进度计算准确性。',
    testCases: [
      { id: 'TC-006', title: '快速添加喝水', steps: [
        { title: '步骤1：点击快捷水量按钮', op: '点击首页"今日饮水"区域的"250ml"快捷按钮', expect: '显示"已添加250ml"，进度环更新' },
        { title: '步骤2：多次点击累积', op: '再次点击"250ml"按钮两次', expect: '总量显示750ml，进度环按比例更新' }
      ]},
      { id: 'TC-007', title: '自定义饮水量', steps: [
        { title: '步骤1：打开自定义输入', op: '点击"自定义"按钮', expect: '弹出饮水量输入对话框' },
        { title: '步骤2：输入并添加', op: '输入容量500ml，点击"添加"', expect: '显示"已添加500ml"，饮水总量和进度环更新' }
      ]},
      { id: 'TC-008', title: '饮水达标动画', steps: [
        { title: '步骤1：添加饮水至达标', op: '连续添加饮水直到达到日目标（默认2000ml）', expect: '进度环变为绿色渐变，显示"已达标"标识，弹出鼓励文案' }
      ]}
    ]
  },
  {
    id: 'flow4', name: '模块四：AI健康顾问', icon: '🤖',
    description: '验证AI对话创建与回复、AI顾问风格切换、过敏食材警告等功能。需要LangGraph服务正常运行。',
    testCases: [
      { id: 'TC-009', title: '创建AI对话', steps: [
        { title: '步骤1：进入AI顾问', op: '点击"AI顾问"，新建会话', expect: '显示会话类' },
        { title: '步骤2：选择会话类型并发消息', op: '选择"营养咨询"，输入"我今天午餐吃了米饭和宫保鸡丁，营养怎么样？"', expect: 'AI以流式方式逐步回复，分析营养成分并给出建议' }
      ]},

// ── 状态存储 ──
const tcResults = {}; // { 'TC-001': { steps: [{status:'',reason:''},...], overall:'', overallReason:'' } }

// ── 初始化 ──
document.getElementById('testerDate').value = new Date().toISOString().split('T')[0];

testFlows.forEach(flow => {
  flow.testCases.forEach(tc => {
    tcResults[tc.id] = {
      steps: tc.steps.map(() => ({ status: '', reason: '' })),
      overall: '',
      overallReason: ''
    };
  });
});

// ── 渲染 ──
function renderFlows() {
  const container = document.getElementById('flowsContainer');
  container.innerHTML = '';

  testFlows.forEach(flow => {
    const flowEl = document.createElement('div');
    flowEl.className = 'flow-card';
    flowEl.innerHTML = `
      <div class="flow-header">
        <span class="flow-icon">${flow.icon}</span>
        <span>${flow.name}</span>
        <span class="flow-badge">${flow.testCases.length} 个用例</span>
      </div>
      <div class="flow-body">
        <div class="flow-desc"><strong>测试目标：</strong>${flow.description}</div>
        <div class="flow-status-bar" id="flowStatus_${flow.id}">
          <span>模块状态：</span>
          <span class="status-tag pending" id="flowTag_${flow.id}">待测试</span>
          <span id="flowProgress_${flow.id}" style="margin-left:auto;font-weight:600">0 / ${flow.testCases.length} 已测</span>
        </div>
        <div id="tcContainer_${flow.id}"></div>
      </div>
    `;
    container.appendChild(flowEl);

    const tcContainer = flowEl.querySelector(`#tcContainer_${flow.id}`);
    flow.testCases.forEach(tc => {
      const tcEl = document.createElement('div');
      tcEl.className = 'tc-card';
      tcEl.id = `tcCard_${tc.id}`;

      let stepsHtml = '';
      tc.steps.forEach((step, si) => {
        stepsHtml += `
          <div class="step" id="step_${tc.id}_${si}">
            <div class="step-top">
              <div class="step-title">${step.title}</div>
              <div class="step-radio">
                <label class="pass-label"><input type="radio" name="step_${tc.id}_${si}" value="pass" onchange="onStepChange('${tc.id}',${si},'pass')"> 通过</label>
                <label class="fail-label"><input type="radio" name="step_${tc.id}_${si}" value="fail" onchange="onStepChange('${tc.id}',${si},'fail')"> 不通过</label>
              </div>
            </div>
            <div class="step-op">操作：${step.op}</div>
            <div class="step-expect">${step.expect}</div>
            <div class="step-reason" id="stepReason_${tc.id}_${si}">
              <textarea placeholder="请详细描述不通过的原因..." oninput="onStepReasonChange('${tc.id}',${si},this.value)"></textarea>
            </div>
          </div>
        `;
      });

      tcEl.innerHTML = `
        <div class="tc-header" onclick="toggleTc('${tc.id}')">
          <span class="tc-tag">${tc.id}</span>
          <span>${tc.title}</span>
          <span class="tc-status pending" id="tcStatus_${tc.id}">待测试</span>
          <span class="toggle-arrow" id="tcArrow_${tc.id}">▶</span>
        </div>
        <div class="tc-body" id="tcBody_${tc.id}">
          ${stepsHtml}
          <div class="case-overall">
            <h5>用例整体状态</h5>
            <div class="overall-radio">
              <label class="pass-label"><input type="radio" name="overall_${tc.id}" value="pass" onchange="onOverallChange('${tc.id}','pass')"> 整体通过</label>
              <label class="fail-label"><input type="radio" name="overall_${tc.id}" value="fail" onchange="onOverallChange('${tc.id}','fail')"> 整体不通过</label>
            </div>
            <div class="overall-reason" id="overallReason_${tc.id}">
              <textarea placeholder="请详细描述整体不通过的原因..." oninput="onOverallReasonChange('${tc.id}',this.value)"></textarea>
            </div>
          </div>
        </div>
      `;
      tcContainer.appendChild(tcEl);
    });
  });
}

// ── 交互 ──
function toggleTc(tcId) {
  const body = document.getElementById(`tcBody_${tcId}`);
  const arrow = document.getElementById(`tcArrow_${tcId}`);
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

function onStepChange(tcId, stepIdx, value) {
  tcResults[tcId].steps[stepIdx].status = value;
  const reasonEl = document.getElementById(`stepReason_${tcId}_${stepIdx}`);
  if (value === 'fail') {
    reasonEl.classList.add('show');
  } else {
    reasonEl.classList.remove('show');
    tcResults[tcId].steps[stepIdx].reason = '';
  }
  updateTcStatus(tcId);
  updateFlowStatus(tcId);
  updateStats();
}

function onStepReasonChange(tcId, stepIdx, value) {
  tcResults[tcId].steps[stepIdx].reason = value;
}

function onOverallChange(tcId, value) {
  tcResults[tcId].overall = value;
  const reasonEl = document.getElementById(`overallReason_${tcId}`);
  if (value === 'fail') {
    reasonEl.classList.add('show');
  } else {
    reasonEl.classList.remove('show');
    tcResults[tcId].overallReason = '';
  }
  updateTcStatus(tcId);
  updateFlowStatus(tcId);
  updateStats();
}

function onOverallReasonChange(tcId, value) {
  tcResults[tcId].overallReason = value;
}

function updateTcStatus(tcId) {
  const r = tcResults[tcId];
  const statusEl = document.getElementById(`tcStatus_${tcId}`);
  const cardEl = document.getElementById(`tcCard_${tcId}`);
  const allPass = r.steps.every(s => s.status === 'pass');
  const anyFail = r.steps.some(s => s.status === 'fail');
  const allDone = r.steps.every(s => s.status !== '');

  cardEl.classList.remove('tc-pass', 'tc-fail');

  if (r.overall === 'pass' || (allDone && allPass && !r.overall)) {
    statusEl.textContent = '通过';
    statusEl.className = 'tc-status pass';
    cardEl.classList.add('tc-pass');
  } else if (r.overall === 'fail' || anyFail) {
    statusEl.textContent = '不通过';
    statusEl.className = 'tc-status fail';
    cardEl.classList.add('tc-fail');
  } else {
    statusEl.textContent = '待测试';
    statusEl.className = 'tc-status pending';
  }
}

function updateFlowStatus(tcId) {
  for (const flow of testFlows) {
    const tcIds = flow.testCases.map(t => t.id);
    if (tcIds.includes(tcId)) {
      const flowId = flow.id;
      let passCount = 0, failCount = 0, testedCount = 0;
      flow.testCases.forEach(tc => {
        const r = tcResults[tc.id];
        const allPass = r.steps.every(s => s.status === 'pass');
        const anyFail = r.steps.some(s => s.status === 'fail');
        const allDone = r.steps.every(s => s.status !== '');
        if (r.overall === 'pass' || (allDone && allPass)) { passCount++; testedCount++; }
        else if (r.overall === 'fail' || anyFail) { failCount++; testedCount++; }
        else if (r.steps.some(s => s.status !== '')) { testedCount++; }
      });

      const tagEl = document.getElementById(`flowTag_${flowId}`);
      const progressEl = document.getElementById(`flowProgress_${flowId}`);
      const total = flow.testCases.length;
      progressEl.textContent = `${testedCount} / ${total} 已测`;

      tagEl.className = 'status-tag';
      if (passCount === total) { tagEl.textContent = '全部通过'; tagEl.classList.add('pass'); }
      else if (failCount > 0) { tagEl.textContent = `${failCount} 个不通过`; tagEl.classList.add('fail'); }
      else if (passCount > 0) { tagEl.textContent = `${passCount}/${total} 通过`; tagEl.classList.add('partial'); }
      else { tagEl.textContent = '待测试'; tagEl.classList.add('pending'); }
      break;
    }
  }
}

function updateStats() {
  let pass = 0, fail = 0, pending = 0;
  const total = Object.keys(tcResults).length;

  Object.entries(tcResults).forEach(([tcId, r]) => {
    const allPass = r.steps.every(s => s.status === 'pass');
    const anyFail = r.steps.some(s => s.status === 'fail');
    const allDone = r.steps.every(s => s.status !== '');

    if (r.overall === 'pass' || (allDone && allPass)) pass++;
    else if (r.overall === 'fail' || anyFail) fail++;
    else pending++;
  });

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPass').textContent = pass;
  document.getElementById('statFail').textContent = fail;
  document.getElementById('statPending').textContent = pending;

  const tested = pass + fail;
  const pct = total > 0 ? Math.round((tested / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = pct + '%';

  const topStatus = document.getElementById('topStatus');
  if (pending === 0) topStatus.textContent = '测试状态：全部完成';
  else if (tested > 0) topStatus.textContent = `测试状态：进行中 (${tested}/${total})`;
  else topStatus.textContent = '测试状态：待执行';
}

// ── 提交 ──
function submitResults() {
  const name = document.getElementById('testerName').value.trim();
  const date = document.getElementById('testerDate').value;
  if (!name) { showToast('请填写测试人员姓名', 'warning'); return; }
  if (!date) { showToast('请选择测试日期', 'warning'); return; }

  const pending = Object.values(tcResults).filter(r => r.overall === '' && !r.steps.some(s => s.status !== '')).length;
  if (pending > 0) {
    if (!confirm(`还有 ${pending} 个用例未测试，确定要提交吗？`)) return;
  }

  const result = {
    tester_name: name,
    test_date: date,
    test_env: document.getElementById('testerEnv').value,
    test_device: document.getElementById('testerDevice').value,
    test_cases: tcResults,
    submit_time: new Date().toISOString()
  };

  // 保存到本地
  const key = `dietai_testResults_${date}_${name}`;
  localStorage.setItem(key, JSON.stringify(result));

  // 导出JSON文件
  const blob = new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `DietAI测试结果_${name}_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);

  showToast('测试结果已导出！', 'success');
}

// ── Toast ──
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ── 启动 ──
renderFlows();
</script>
